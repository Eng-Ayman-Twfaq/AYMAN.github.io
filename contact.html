<section class="contact-section container">
  <div class="section-header" data-aos="fade-down">
    <h2 data-translate="contactHeader"><i class="fas fa-envelope-open-text"></i> تواصل معي</h2>
    <p data-translate="contactDescription">يمكنك التواصل معي عبر النموذج أدناه أو عبر وسائل التواصل الأخرى</p>
  </div>

  <div class="contact-container">
    <div class="contact-form" data-aos="fade-right">
      <!-- تم إزالة action و method من <form> لأننا نتعامل معه عبر JavaScript -->
      <form id="contact-form">
        <div class="form-group">
          <label for="name" data-translate="nameLabel"><i class="fas fa-user"></i> الاسم الكامل</label>
          <input type="text" id="name" name="name" required placeholder="أدخل اسمك الكامل" data-translate="namePlaceholder"/>
        </div>
        
        <div class="form-group">
          <label for="email" data-translate="emailLabel"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
          <input type="email" id="email" name="email" required placeholder="example@mail.com" data-translate="emailPlaceholder"/>
        </div>
        
       <div class="form-group">
  <label for="subject" data-translate="subjectLabel"><i class="fas fa-tag"></i> الخدمة المطلوبة</label>
  <select id="subject" name="subject" required>
    <option value="" disabled selected data-translate="subjectPlaceholder">اختر الخدمة التي تحتاجها</option>
    <option value="تطوير-موقع-ويب" data-translate="webDevelopmentOption">تطوير موقع ويب</option>
    <option value="تطوير-تطبيق-جوال" data-translate="mobileAppOption">تطوير تطبيق جوال (Flutter)</option>
    <option value="برمجة-Laravel" data-translate="laravelDevelopmentOption">برمجة Laravel</option>
    <option value="برمجة-انظمة-مدمجة" data-translate="embeddedSystemsOption">برمجة أنظمة مدمجة (Arduino)</option>
    <option value="تحليل-تصميم-قواعد-بيانات" data-translate="databaseDesignOption">تحليل وتصميم قواعد بيانات</option>
    <option value="استشارة-تقنية" data-translate="technicalConsultationOption">استشارة تقنية</option>
    <option value="اخرى" data-translate="otherServiceOption">خدمة أخرى</option>
  </select>
</div>
        
        <div class="form-group">
          <label for="message" data-translate="messageLabel"><i class="fas fa-comment"></i> الرسالة</label>
          <textarea id="message" name="message" required placeholder="اكتب رسالتك هنا..." data-translate="messagePlaceholder"></textarea>
        </div>
        
        <!-- تم إزالة onclick من الزر -->
        <button type="submit" class="submit-btn" data-translate="submitBtn">
          <i class="fas fa-paper-plane"></i> إرسال الرسالة
        </button>
      </form>
    </div>

    <div class="contact-info" data-aos="fade-left">
      <div class="info-item">
        <div class="info-icon">
          <i class="fas fa-map-marker-alt"></i>
        </div>
        <div class="info-content">

      </div>
      
      <div class="info-item">

          <a href="mailto:ayman.tawfaq.developer@gmail.com" data-translate="emailLink">ayman.tawfaq.developer@gmail.com</a>

      <div class="info-item">

      <div class="info-item">

        </div>
      </div>
    </div>

    <div class="map-container" data-aos="zoom-in">
      <div class="map">
        <iframe

<!-- سكريبت مخصص لمعالجة إرسال النموذج -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // تفعيل AOS إذا لم يتم تفعيله في header.js
    if (typeof AOS !== 'undefined') {
       AOS.init({
        duration: 800,
        easing: 'ease-out-cubic',
        once: true
      });
    }

    const contactForm = document.getElementById('contact-form');
    if (contactForm) {
      contactForm.addEventListener('submit', function(event) {
        // منع السلوك الافتراضي لإرسال النموذج
        event.preventDefault();
        
        // هنا يمكنك إضافة منطق إرسال البيانات عبر Ajax إذا رغبت
        // على سبيل المثال باستخدام fetch() أو XMLHttpRequest
        // ولكن في هذه الحالة، نريد فقط إعادة التوجيه
        
        // إعادة التوجيه إلى صفحة الشكر
        window.location.href = 'thankyou.html';
      });
    }
  });
</script>
